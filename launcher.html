:root{--bg:#eef0ff;--dot:#dadcfb;--card:#ffffff;--ink:#1d1b4b;--mute:#6c6a99;--line:#dcdcf6;--acc:#5b4cf0;--hl:#ffcf3a;--hl-d:#dba300;--tile:#ffffff;--tile-d:#cfd0ef;
--font:'Fredoka',ui-rounded,system-ui,sans-serif;--spring:cubic-bezier(.34,1.56,.64,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13132e;--dot:#1f2048;--card:#1f2052;--ink:#f2f1ff;--mute:#a4a3d8;--line:#34357a;--acc:#8577ff;--hl:#ffd34d;--hl-d:#c79500;--tile:#2a2b66;--tile-d:#14154a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13132e;--dot:#1f2048;--card:#1f2052;--ink:#f2f1ff;--mute:#a4a3d8;--line:#34357a;--acc:#8577ff;--hl:#ffd34d;--hl-d:#c79500;--tile:#2a2b66;--tile-d:#14154a;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent;
  background:radial-gradient(var(--dot) 1.3px,transparent 1.5px) 0 0/20px 20px,var(--bg)}
main{width:100%;max-width:440px;margin:0 auto;padding-block:24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 0 14px}
.logo div{display:flex;gap:6px}
.logo span{display:grid;place-items:center;width:44px;height:54px;border-radius:13px;background:var(--tile);border:2px solid var(--line);box-shadow:0 5px 0 var(--tile-d);
  font-weight:700;font-size:1.8rem;color:var(--ink);animation:drop .7s var(--spring) both}
.logo span.r{background:var(--hl);border-color:var(--hl-d);box-shadow:0 5px 0 var(--hl-d);color:#1d1b4b;animation:drop .7s var(--spring) both,wob 2.6s ease-in-out 1.2s infinite}
@media(max-width:360px){.logo span{width:38px;height:47px;font-size:1.55rem}}
.tag{text-align:center;color:var(--mute);font-weight:500;margin:-6px 0 6px;animation:rise .6s var(--spring) .5s both}
button{font:inherit;font-weight:600;font-size:1.1rem;border:0;cursor:pointer;width:100%;border-radius:20px;padding:16px;color:#fff;background:var(--acc);
  box-shadow:0 6px 0 color-mix(in srgb,var(--acc) 60%,#000);transition:transform .1s,box-shadow .1s;animation:rise .55s var(--spring) both}
button:active{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 60%,#000)}
button:focus-visible,input:focus-visible{outline:3px solid var(--hl);outline-offset:3px}
.mode{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:14px;text-align:left;padding:16px 18px}
.mode svg{width:52px;height:52px}

#single{background:#ff6b4a;box-shadow:0 6px 0 #c94a2e;animation-delay:.15s}#single:active{box-shadow:0 1px 0 #c94a2e}

.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.alt:active{box-shadow:0 0 0 var(--line)}

.row{display:flex;gap:10px}.row>*{flex:1}
.link{width:auto;align-self:center;background:none;box-shadow:none;color:var(--mute);font-weight:500;font-size:.95rem;padding:8px;text-decoration:underline;text-underline-offset:3px;animation:none}
.link:active{transform:none;box-shadow:none}
input{font:inherit;font-weight:600;font-size:1.2rem;width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center}

.card{background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:18px;text-align:center;display:flex;flex-direction:column;gap:12px;animation:rise .5s var(--spring) both}

</main><script>

const SFX=(()=>{
  let ac=null,master=null;
  const muted=()=>{try{if(typeof snd!=='undefined')return !snd}catch(e){}try{return localStorage.getItem('lr-snd')==='0'}catch(e){return false}};
  function ctx(){
    if(ac)return ac;
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{ac=new C();const comp=ac.createDynamicsCompressor();master=ac.createGain();master.gain.value=.55;master.connect(comp);comp.connect(ac.destination)}catch(e){ac=null}
    return ac;
  }
  const unlock=()=>{const a=ctx();if(a&&a.state==='suspended')a.resume().catch(()=>{})};
  ['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,unlock,{passive:true,capture:true}));
  function tone(f,{t=0,d=.12,type='sine',v=.2,to=null,a=.005,vib=0}={}){
    const A=ctx();if(!A)return;const s=A.currentTime+t;
    const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.setValueAtTime(f,s);
    if(to)o.frequency.exponentialRampToValueAtTime(to,s+d);
    if(vib){const l=A.createOscillator(),lg=A.createGain();l.frequency.value=vib;lg.gain.value=f*.03;l.connect(lg);lg.connect(o.frequency);l.start(s);l.stop(s+d+.05)}
    g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+a);g.gain.exponentialRampToValueAtTime(.0001,s+d);
    o.connect(g);g.connect(master);o.start(s);o.stop(s+d+.05);
  }
  function noise({t=0,d=.15,v=.12,f=1200,q=.8,to=null}={}){
    const A=ctx();if(!A)return;const s=A.currentTime+t,n=Math.floor(A.sampleRate*d);
    const b=A.createBuffer(1,n,A.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
    const src=A.createBufferSource(),bp=A.createBiquadFilter(),g=A.createGain();src.buffer=b;bp.type='bandpass';bp.frequency.setValueAtTime(f,s);bp.Q.value=q;
    if(to)bp.frequency.exponentialRampToValueAtTime(to,s+d);
    g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);src.connect(bp);bp.connect(g);g.connect(master);src.start(s);src.stop(s+d+.02);
  }
  const N={C5:523.25,D5:587.33,E5:659.25,G5:783.99,A5:880,C6:1046.5,E6:1318.5,G6:1568};
  const S={
    click(){tone(620,{d:.05,type:'square',v:.05,to:900});noise({d:.03,v:.03,f:3000})},
    key(i=0){tone(520+i*55,{d:.06,type:'triangle',v:.09,to:620+i*55})},
    drop(i=0){tone(260+i*35,{t:i*.045,d:.07,v:.07,to:200+i*35})},
    count(){tone(440,{d:.16,type:'square',v:.07});tone(220,{d:.18,v:.12})},
    go(){[N.C5,N.E5,N.G5,N.C6].forEach((f,i)=>tone(f,{t:i*.05,d:.16,type:'square',v:.06}));noise({d:.35,v:.08,f:600,to:5000})},
    correct(){[N.C5,N.E5,N.G5,N.C6].forEach((f,i)=>tone(f,{t:i*.06,d:.18,type:'triangle',v:.13}));tone(N.E6,{t:.26,d:.4,v:.05});tone(N.G6,{t:.3,d:.4,v:.04})},
    crown(){tone(N.E6,{t:.32,d:.7,v:.07});tone(N.C6*1.5,{t:.36,d:.6,v:.05});noise({t:.32,d:.25,v:.04,f:7000})},
    opp(){[N.G5,N.E5,N.C5].forEach((f,i)=>tone(f,{t:i*.07,d:.16,type:'triangle',v:.09}))},
    wrong(){tone(190,{d:.12,type:'sawtooth',v:.09,to:140});tone(190,{t:.13,d:.16,type:'sawtooth',v:.09,to:110})},
    timeup(){tone(440,{d:.5,type:'triangle',v:.14,to:200});noise({d:.4,v:.05,f:800,to:200})},
    hint(){tone(600,{d:.35,v:.08,to:1500});[N.C6,N.E6,N.G6].forEach((f,i)=>tone(f,{t:.12+i*.07,d:.25,v:.04}))},
    found(){[N.G5,N.C6].forEach((f,i)=>tone(f,{t:i*.09,d:.25,type:'triangle',v:.12}));noise({d:.2,v:.05,f:4000})},
    tick(){tone(1100,{d:.03,type:'square',v:.035})},
    win(){const m=[[N.C5,0],[N.E5,.12],[N.G5,.24],[N.C6,.36],[N.G5,.52],[N.C6,.64]];m.forEach(([f,t])=>tone(f,{t,d:.2,type:'square',v:.06}));
      [N.C5,N.E5,N.G5,N.C6].forEach(f=>tone(f,{t:.82,d:1.1,type:'triangle',v:.08}));noise({t:.8,d:.6,v:.05,f:6000})},
    lose(){[392,370,349,330].forEach((f,i)=>tone(f,{t:i*.28,d:i===3?.8:.3,type:'triangle',v:.13,vib:i===3?6:0}))},
    draw(){tone(N.E5,{d:.3,type:'triangle',v:.1});tone(N.G5,{t:.15,d:.4,type:'triangle',v:.1})},
    menu(){tone(480,{d:.09,v:.16,to:880});tone(960,{t:.025,d:.06,type:'triangle',v:.05})},
    select(){tone(N.A5,{d:.07,type:'triangle',v:.1});tone(N.E6,{t:.05,d:.12,type:'triangle',v:.07})},
    whoosh(){noise({d:.32,v:.16,f:350,q:1.2,to:3600});tone(180,{d:.28,v:.05,to:420})},
    back(){noise({d:.3,v:.15,f:3200,q:1.2,to:300});tone(380,{d:.26,v:.05,to:150})}
  };
  return {play(n,a){if(muted()||!S[n])return;try{if(!ctx())return;unlock();S[n](a)}catch(e){}}};
})();

addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;SFX.play(b.id==='back'?'back':'menu')},{capture:true});
(function(){let first=true;new MutationObserver(ms=>{for(const m of ms){const t=m.target;if(!['home','rushv','whv','hmv','multiv','hostv','joinv'].includes(t.id))continue;
  if(/\bhide\b/.test(m.oldValue||'')&&!t.classList.contains('hide')){if(t.id!=='home')SFX.play('whoosh');break}}})
  .observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class'],attributeOldValue:true});
  addEventListener('load',()=>setTimeout(()=>SFX.play('whoosh'),120));})();
</script><script>
try{const t=localStorage.getItem('lr-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}

        var b2 = read();
        var b3 = read();

        if (c < 128) {
          bytes.push(c);

    for (var i = 8; i < 256; i += 1) {
      EXP_TABLE[i] = EXP_TABLE[i - 4]
        ^ EXP_TABLE[i - 5]
        ^ EXP_TABLE[i - 6]
        ^ EXP_TABLE[i - 8];

    for (var i = 0; i < 255; i += 1) {
      LOG_TABLE[EXP_TABLE[i] ] = i;

      if (n < 1) {
        throw 'glog(' + n + ')';
      }

      return LOG_TABLE[n];
    };

    _this.gexp = function(n) {

      while (n < 0) {
        n += 255;
      }

      while (n >= 256) {
        n -= 255;
      }

      return EXP_TABLE[n];
    };

    return _this;
  }();

  function qrPolynomial(num, shift) {

    if (typeof num.length == 'undefined') {
      throw num.length + '/' + shift;

      var offset = 0;

        offset += 1;
      }
      var _num = new Array(num.length - offset + shift);

      return _num[index];
    };

    _this.getLength = function() {
      return _num.length;

      var num = new Array(_this.getLength() + e.getLength() - 1);

      for (var i = 0; i < _this.getLength(); i += 1) {
        for (var j = 0; j < e.getLength(); j += 1) {
          num[i + j] ^= QRMath.gexp(QRMath.glog(_this.getAt(i) ) + QRMath.glog(e.getAt(j) ) );
        }
      }

      return qrPolynomial(num, 0);
    };

    _this.mod = function(e) {

      if (_this.getLength() - e.getLength() < 0) {
        return _this;
      }

      var ratio = QRMath.glog(_this.getAt(0) ) - QRMath.glog(e.getAt(0) );

      var num = new Array(_this.getLength() );
      for (var i = 0; i < _this.getLength(); i += 1) {
        num[i] = _this.getAt(i);
      }

      for (var i = 0; i < e.getLength(); i += 1) {
        num[i] ^= QRMath.gexp(QRMath.glog(e.getAt(i) ) + ratio);
      }

      // recursive call
      return qrPolynomial(num, 0).mod(e);
    };

    return _this;
  };
